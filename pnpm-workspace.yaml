linkWorkspacePackages: true
saveWorkspaceProtocol: rolling
sharedWorkspaceLockfile: true
catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExcludePrune: true
# Security releases may need to bypass the age gate after their exact versions
# have been reviewed and pinned below.
minimumReleaseAgeExclude:
  - '@cloudbase/js-sdk@3.8.0'
  - nanoid@3.3.18

trustPolicy: no-downgrade
# Ignore trust downgrades for packages published more than 7 days (10080 min)
# ago. Established transitive deps (e.g. semver@6.3.1, rollup@2.80.0 via
# vite-plugin-pwa / @capacitor/assets) simply predate provenance attestation,
# which `no-downgrade` would otherwise flag. New/just-published packages are
# still checked, so protection against fresh supply-chain attacks is retained.
trustPolicyIgnoreAfter: 10080

# These exact releases retain cssnano's GitHub Actions provenance. Earlier
# manually approved releases rank above OIDC in pnpm's trust policy.
trustPolicyExclude:
  - cssnano@9.6.0
  - cssnano-preset-default@9.6.0
  - cssnano-utils@9.0.0
  - postcss-colormin@9.0.8
  - postcss-convert-values@9.0.9
  - postcss-discard-comments@9.0.8
  - postcss-discard-duplicates@9.0.7
  - postcss-discard-empty@9.0.8
  - postcss-discard-overridden@9.0.6
  - postcss-merge-longhand@9.4.0
  - postcss-merge-rules@9.1.4
  - postcss-minify-font-values@9.0.9
  - postcss-minify-gradients@9.0.8
  - postcss-minify-params@9.0.8
  - postcss-minify-selectors@9.0.8
  - postcss-normalize-charset@9.0.6
  - postcss-normalize-display-values@9.0.7
  - postcss-normalize-positions@9.0.8
  - postcss-normalize-repeat-style@9.0.7
  - postcss-normalize-string@9.0.7
  - postcss-normalize-timing-functions@9.0.7
  - postcss-normalize-unicode@9.1.1
  - postcss-normalize-url@9.0.7
  - postcss-normalize-whitespace@9.0.8
  - postcss-ordered-values@9.0.9
  - postcss-reduce-initial@9.0.7
  - postcss-reduce-transforms@9.0.6
  - postcss-svgo@9.0.6
  - postcss-unique-selectors@9.0.6
  - stylehacks@9.0.8

peerDependencyRules:
  allowedVersions:
    # These integrations support the current runtime in practice, but their
    # published peer ranges have not caught up with the upstream major yet.
    '@stencil/vue-output-target>vue-router': ^5.2.0
    unplugin-mockery>rollup: ^4.62.4
    vitepress-plugin-mermaid>vitepress: 2.0.0-alpha.19
    vite-ssg>beasties: ^0.5.4

resolvePeersFromWorkspaceRoot: true
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
# lodash.set has no published 4.3.3 release. The pinned 4.3.2 package is
# patched below with Lodash's upstream unsafe-path guard and regression-tested.
auditConfig:
  ignoreGhsas:
    - GHSA-p6mc-m468-83gw

sideEffectsCache: false
pmOnFail: download

packages:
  - demo/*
  - docs
  - editor/*
  - examples/*
  - packages/*
  - packages/*/playground
  - plugins/*
  - templates/*
  - themes/*
  - playground
  - apps/*
  - apps/studio/cloudbase/functions/*
  - apps/studio/cloudbase/scripts

# pnpm reads dependency overrides from the workspace manifest. Keep shared
# toolchain versions coherent and pin compatible security fixes for transitive
# dependencies whose parents have not yet refreshed their ranges.
overrides:
  # Forge 7 rebuild uses a git-only node-gyp; pin Electron's published fork.
  '@electron/rebuild>@electron/node-gyp': 10.2.0-electron.2
  '@trpc/server@>=11 <12': 11.8.0
  axios@<0.33.0: 0.33.0
  brace-expansion@<2: 1.1.18
  brace-expansion@>=5 <6: 5.0.9
