  tar: 7.5.22

  typescript: 5.9.3
  undici@>=7 <8: 7.29.0

  vite: 8.3.4
  # Keep Nuxt and game clients on the same Vue runtime.
  vue: 'catalog:frontend'

packageExtensions:
  # Keep this adapter's optional cac peer compatible alongside Vitest's cac 7.
  '@bomb.sh/tab@0.0.19':
    dependencies:
      cac: ^6.7.14

patchedDependencies:
  lodash.set@4.3.2: patches/lodash.set@4.3.2.patch

