strictPeerDependencies: false
linkWorkspacePackages: true
sharedWorkspaceLockfile: true
resolvePeersFromWorkspaceRoot: true
sideEffectsCache: false
catalogMode: strict
cleanupUnusedCatalogs: true
saveWorkspaceProtocol: rolling
minimumReleaseAge: 10080
# Security releases may need to bypass the age gate after their exact versions
# have been reviewed and pinned below.
minimumReleaseAgeExclude:
  - nanoid@3.3.18
shamefullyHoist: true
shellEmulator: true
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
pmOnFail: download
# lodash.set has no published 4.3.3 release. The pinned 4.3.2 package is
# patched below with Lodash's upstream unsafe-path guard and regression-tested.
auditConfig:
  ignoreGhsas:
    - GHSA-p6mc-m468-83gw
packages:
  - demo/*
  - docs
  - editor/*
  - examples/*
  - packages/*
  - packages/*/playground
  - plugins/*
  - templates/*
  - themes/*
  - playground
  - apps/*
  - apps/studio/cloudbase/functions/*
  - apps/studio/cloudbase/scripts

# pnpm 11 reads dependency overrides from the workspace manifest. Keep shared
# toolchain versions coherent and pin compatible security fixes for transitive
# dependencies whose parents have not yet refreshed their ranges.
overrides:
  '@trpc/server@>=11 <12': 11.8.0
  axios@<0.33.0: 0.33.0
  brace-expansion@<2: 1.1.18
  brace-expansion@>=5 <6: 5.0.9
