allowBuilds:
  '@parcel/watcher': false
  bufferutil: false
  core-js: false
  core-js-pure: false
  cos-js-sdk-v5: false
  esbuild: false
  msw: false
  protobufjs: false
  sharp: true
  unrs-resolver: false
  vue-demi: true
  workerd: true
# Ignore trust downgrades for packages published more than 7 days (10080 min)
# ago. Established transitive deps (e.g. semver@6.3.1, rollup@2.80.0 via
# vite-plugin-pwa / @capacitor/assets) simply predate provenance attestation,
# which `no-downgrade` would otherwise flag. New/just-published packages are
# still checked, so protection against fresh supply-chain attacks is retained.
trustPolicyIgnoreAfter: 10080
