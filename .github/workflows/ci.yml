name: ADV.JS CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Node LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build

  editor-pages-build:
    name: editor-pages-build
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 'lts/*'
      PNPM_VERSION: 12.12.1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce Cloudflare Pages build command
        run: pnpm editor:build
      - name: Verify Cloudflare Pages output directory
        run: test -f editor/core/dist/index.html

  studio-pages-build:
    name: studio-pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce Cloudflare Pages build command
        run: pnpm studio:build
      - name: Verify Studio Pages output
        run: test -f apps/studio/dist/index.html && test -f apps/studio/dist/sw.js

  # Studio jobs run only for changes that can affect them (scripts/ci/studio-changes.mjs).
  # launch-required accepts a skipped Studio job only when this job reports so.
  studio-changes:
    name: studio-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      studio: ${{ steps.changes.outputs.studio }}
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Studio changes
        id: changes
        env:
          STUDIO_EVENT: ${{ github.event_name }}
          STUDIO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STUDIO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/studio-changes.mjs

  # Studio's own Vite/Vitest config is excluded from the root unit job. Shared
  # content, validation and authoring modules are also checked here through
  # the native Studio engine, so a change cannot pass on one client only.
  studio-unit:
    name: studio-unit (Node LTS)
    needs: studio-changes
    if: needs.studio-changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Studio and engine fixture dependencies
        run: pnpm prepare:workspace studio-ios
      - name: Run Studio unit tests
        run: pnpm -C apps/studio exec vitest run
      - name: Build the native Studio engine
        run: pnpm -C apps/studio-ios build:engine
      - name: Test the native Studio engine on Node
        run: pnpm -C apps/studio-ios test:engine

  # StudioKit (including golden parity on iOS JavaScriptCore) and the App unit
  # tests run once, on the iPhone; the iPad runs only its own UI tests.
  studio-ios:
    name: studio-ios (JavaScriptCore and App)
    needs: studio-changes
    if: needs.studio-changes.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      # Simulators boot while dependencies install; xcodebuild waits for them.
      - name: Start booting the simulators
        run: node apps/studio-ios/scripts/simulator-destinations.mjs --boot
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build engine fixture dependencies
        run: pnpm prepare:workspace studio-ios
      - name: Build the engine, golden cases and sample packages
        run: pnpm -C apps/studio-ios build:engine && pnpm -C apps/studio-ios golden && pnpm -C apps/studio-ios build:samples
      - name: StudioKit on iPhone
        working-directory: apps/studio-ios/Packages/StudioKit
        run: xcodebuild test -scheme StudioKit $(node ../../scripts/simulator-destinations.mjs --only iphone) -resultBundlePath ../../build/StudioKit.xcresult
      - name: Build the App for testing
        working-directory: apps/studio-ios
        run: xcodebuild build-for-testing -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only iphone) -derivedDataPath build/DerivedData
      # Unit and UI tests run as separate invocations; combined, the hosted unit
      # bundle can stall after the UI tests finish.
      - name: App unit tests on iPhone
        working-directory: apps/studio-ios
        run: xcodebuild test-without-building -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only iphone) -derivedDataPath build/DerivedData -only-testing:StudioAppTests -resultBundlePath build/StudioAppTests.xcresult
      - name: UI tests on iPhone
        working-directory: apps/studio-ios
        run: xcodebuild test-without-building -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only iphone) -derivedDataPath build/DerivedData -only-testing:StudioAppUITests -resultBundlePath build/UITests-iPhone.xcresult
      - name: UI tests on iPad
        working-directory: apps/studio-ios
        run: xcodebuild test-without-building -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only ipad) -derivedDataPath build/DerivedData -only-testing:StudioAppUITests/IPadLayoutUITests -resultBundlePath build/UITests-iPad.xcresult
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-ios
          path: |
            apps/studio-ios/engine/dist/engine.report.json
            apps/studio-ios/engine/dist/golden/summary.json
            apps/studio-ios/build/*.xcresult
          if-no-files-found: warn
          retention-days: 30

  vrm-pages-build:
    name: vrm-pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce VRM Cloudflare Pages build command
        run: pnpm run build:advjs && pnpm plugins:build && pnpm run vrm:build
      - name: Verify VRM Pages output
        run: test -f editor/vrm/dist/index.html && test -f editor/vrm/dist/sw.js

  unit:
    name: unit (Node LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Publication tests deliberately encode and verify real Opus/AAC media.
      - name: Install audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Build test dependencies
        run: pnpm prepare:workspace unit
      - name: Check game theme type contracts
        run: pnpm exec tsc -p tests/tsconfig.game-theme.json --noEmit
      - name: Run unit tests
        run: pnpm vitest run tests/unit --reporter=default

  typecheck:
    name: typecheck (Node LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare lint dependencies
        run: pnpm prepare:workspace lint
      - name: Lint
        run: pnpm lint

  editor-smoke:
    name: editor-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Editor dependencies
        run: pnpm prepare:workspace editor
      - name: Typecheck Editor
        run: pnpm --filter @advjs/editor typecheck
      - name: Build Editor
        run: pnpm --filter @advjs/editor build

  packed-smoke:
    name: packed-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run packed CLI and build smoke
        run: pnpm vitest run tests/launch/packed-build.test.ts --no-file-parallelism --reporter=default
      - name: Run packed install and Editor lifecycle smoke
        env:
          ADVJS_PACKED_INSTALL_SKIP_BUILD: '1'
        run: pnpm vitest run tests/launch/packed-install.test.ts --no-file-parallelism --reporter=default
      - name: Run packed scaffolder and generated project smoke
        env:
          ADVJS_PACKED_INSTALL_SKIP_BUILD: '1'
        run: pnpm vitest run tests/launch/create-adv.test.ts --no-file-parallelism --reporter=default

  e2e:
    name: e2e
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install real audio processing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Build packages
        run: pnpm editor:build
      - name: Install Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # The dedicated editor-e2e job owns these three specs. Keep every other
      # current and future spec in this catch-all gate.
      - name: Run Chromium tests
        run: pnpm exec playwright test '^(?!.*[/\\]editor-(local|security|character-migration)\.spec\.ts$)' --project=chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  editor-e2e:
    name: editor-e2e (Chromium)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Editor launch chain
        run: pnpm editor:build
      - name: Install Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run Editor lifecycle and security tests
        run: pnpm exec playwright test tests/e2e/editor-local.spec.ts tests/e2e/editor-security.spec.ts tests/e2e/editor-character-migration.spec.ts --project=chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-migration-evidence
          path: test-results/editor-character-migration-*/
          if-no-files-found: warn
          retention-days: 30

  agent-install-smoke:
    name: agent-install-smoke
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ADV_LAUNCH_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/agent-install-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run packed Agent installation smoke
        run: pnpm vitest run tests/launch/agent-install-smoke.test.ts --reporter=default
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-install-smoke
          path: artifacts/agent-install-smoke/
          retention-days: 30

  launch-journey:
    name: launch-journey
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      ADVJS_DOCS_JOURNEY_SKIP_BUILD: '1'
      ADV_LAUNCH_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/launch-journey
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare launch dependencies
        run: pnpm prepare:workspace launch
      - name: Install Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run complete launch journey
        run: pnpm test:launch:journey
      - name: Upload launch journey evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launch-journey-${{ github.run_id }}
          path: artifacts/launch-journey/
          if-no-files-found: warn
          retention-days: 30

  launch-required:
    name: launch-required
    if: always()
    needs:
      - build
      - editor-pages-build
      - studio-pages-build
      - studio-changes
      - studio-unit
      - studio-ios
      - vrm-pages-build
      - unit
      - typecheck
      - lint
      - editor-smoke
      - packed-smoke
      - e2e
      - editor-e2e
      - agent-install-smoke
      - launch-journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every launch check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/launch-required.mjs
