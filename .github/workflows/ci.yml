name: ADV.JS CI

on:
  workflow_dispatch:
    inputs:
      native-runner:
        description: Native Apple test image (preview images may queue longer)
        type: choice
        default: macos-26
        options:
          - macos-26
          - xcode-27
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (build, types, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Publication tests deliberately encode and verify real Opus/AAC media.
      - name: Install audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Build test dependencies
        run: pnpm prepare:workspace unit
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check game theme type contracts
        run: pnpm exec tsc -p tests/tsconfig.game-theme.json --noEmit
      - name: Run unit tests
        run: pnpm vitest run tests/unit --reporter=default

  # Studio jobs run only for relevant changes; launch-required verifies skips.
  studio-changes:
    name: studio-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      studio: ${{ steps.changes.outputs.studio }}
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Studio changes
        id: changes
        env:
          STUDIO_EVENT: ${{ github.event_name }}
          STUDIO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STUDIO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/studio-changes.mjs

  studio-pages-build:
    name: studio-pages-build
    needs: studio-changes
    if: needs.studio-changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce Cloudflare Pages build command
        run: pnpm studio:build
      - name: Verify Studio Pages output
        run: test -f apps/studio/dist/index.html && test -f apps/studio/dist/sw.js

  studio-unit:
    name: studio-unit (Node LTS)
    needs: studio-changes
    if: needs.studio-changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Studio and engine fixture dependencies
        run: pnpm prepare:workspace studio-ios
      - name: Run Studio unit tests
        run: pnpm -C apps/studio exec vitest run
      - name: Build the native Studio engine
        run: pnpm -C apps/studio-ios build:engine
      - name: Test the native Studio engine on Node
        run: pnpm -C apps/studio-ios test:engine

      - name: Generate native golden cases and sample packages
        if: needs.studio-changes.outputs.native == 'true'
        run: pnpm -C apps/studio-ios golden && pnpm -C apps/studio-ios build:samples
      # Only portable JS/JSON/sample inputs cross runners, never node_modules.
      # The shared path root is apps/studio-ios, restored at the same location.
      - uses: actions/upload-artifact@v7
        if: needs.studio-changes.outputs.native == 'true'
        with:
          name: studio-ios-inputs
          path: |
            apps/studio-ios/engine/dist/engine.report.json
            apps/studio-ios/engine/dist/golden/summary.json
            apps/studio-ios/Packages/StudioKit/Sources/StudioKit/EngineBundle/
            apps/studio-ios/Packages/StudioKit/Tests/StudioKitTests/Golden/
            apps/studio-ios/StudioApp/Samples/
          if-no-files-found: error
          retention-days: 7

  # Node builds once on Linux; all JavaScriptCore, App and device UI tests stay on iOS.
  studio-ios:
    name: studio-ios (JavaScriptCore and App)
    needs: [studio-changes, studio-unit]
    if: needs.studio-changes.outputs.native == 'true'
    # The project supports iOS 26. Keep PRs off the capacity-limited Xcode 27
    # preview pool; retain that image for explicit latest-platform validation.
    runs-on: ${{ inputs.native-runner == 'xcode-27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ inputs.native-runner == 'xcode-27' && '/Applications/Xcode_27.1.app/Contents/Developer' || '/Applications/Xcode_26.6.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v7
      - name: Inspect Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Download native inputs from this run
        uses: actions/download-artifact@v8
        with:
          name: studio-ios-inputs
          path: apps/studio-ios
      - name: Start booting the simulators
        run: node apps/studio-ios/scripts/simulator-destinations.mjs --boot
      - name: StudioKit on iPhone
        working-directory: apps/studio-ios/Packages/StudioKit
        run: xcodebuild test -parallel-testing-enabled NO -scheme StudioKit $(node ../../scripts/simulator-destinations.mjs --only iphone) -resultBundlePath ../../build/StudioKit.xcresult
      - name: Build the App for testing
        working-directory: apps/studio-ios
        run: xcodebuild build-for-testing -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only iphone) -derivedDataPath build/DerivedData
      # Unit and UI tests run as separate invocations; combined, the hosted unit
      # bundle can stall after the UI tests finish.
      - name: App unit tests on iPhone
        working-directory: apps/studio-ios
        run: xcodebuild test-without-building -parallel-testing-enabled NO -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only iphone) -derivedDataPath build/DerivedData -only-testing:StudioAppTests -resultBundlePath build/StudioAppTests.xcresult
      - name: UI tests on iPhone
        working-directory: apps/studio-ios
        run: xcodebuild test-without-building -parallel-testing-enabled NO -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only iphone) -derivedDataPath build/DerivedData -only-testing:StudioAppUITests -resultBundlePath build/UITests-iPhone.xcresult
      - name: UI tests on iPad
        working-directory: apps/studio-ios
        run: xcodebuild test-without-building -parallel-testing-enabled NO -project StudioApp.xcodeproj -scheme StudioApp $(node scripts/simulator-destinations.mjs --only ipad) -derivedDataPath build/DerivedData -only-testing:StudioAppUITests/IPadLayoutUITests -resultBundlePath build/UITests-iPad.xcresult
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-ios
          overwrite: true
          path: |
            apps/studio-ios/engine/dist/engine.report.json
            apps/studio-ios/engine/dist/golden/summary.json
            apps/studio-ios/build/*.xcresult
          if-no-files-found: warn
          retention-days: 30

  vrm-pages-build:
    name: vrm-pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce VRM Cloudflare Pages build command
        run: pnpm run build:advjs && pnpm plugins:build && pnpm run vrm:build
      - name: Verify VRM Pages output
        run: test -f editor/vrm/dist/index.html && test -f editor/vrm/dist/sw.js

  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Editor dependencies
        run: pnpm prepare:workspace editor
      - name: Typecheck Editor
        run: pnpm --filter @advjs/editor typecheck
      - name: Build Editor
        run: pnpm --filter @advjs/editor build
      # All packages and Editor were freshly built above on this runner.
      - name: Run packed CLI and build smoke
        env:
          ADVJS_PACKED_INSTALL_SKIP_BUILD: '1'
        run: pnpm vitest run tests/launch/packed-build.test.ts --no-file-parallelism --reporter=default
      - name: Run packed install and Editor lifecycle smoke
        env:
          ADVJS_PACKED_INSTALL_SKIP_BUILD: '1'
        run: pnpm vitest run tests/launch/packed-install.test.ts --no-file-parallelism --reporter=default
      - name: Run packed scaffolder and generated project smoke
        env:
          ADVJS_PACKED_INSTALL_SKIP_BUILD: '1'
        run: pnpm vitest run tests/launch/create-adv.test.ts --no-file-parallelism --reporter=default

  browser:
    name: browser (Editor, player, launch journey)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ADVJS_DOCS_JOURNEY_SKIP_BUILD: '1'
      ADV_LAUNCH_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/launch-journey
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install real audio processing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Build packages
        run: pnpm editor:build
      - name: Verify Cloudflare Pages output directory
        run: test -f editor/core/dist/index.html
      - name: Install Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # No file filter: every current and future root browser suite runs once.
      - name: Run all Chromium tests
        run: pnpm exec playwright test --project=chromium
      - name: Run complete launch journey
        run: pnpm test:launch:journey
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-migration-evidence
          path: test-results/editor-character-migration-*/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload launch journey evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launch-journey-${{ github.run_id }}
          path: artifacts/launch-journey/
          if-no-files-found: warn
          retention-days: 30

  agent-install-smoke:
    name: agent-install-smoke
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ADV_LAUNCH_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/agent-install-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run packed Agent installation smoke
        run: pnpm vitest run tests/launch/agent-install-smoke.test.ts --reporter=default
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-install-smoke
          path: artifacts/agent-install-smoke/
          retention-days: 30

  launch-required:
    name: launch-required
    if: always()
    needs:
      - quality
      - studio-changes
      - studio-pages-build
      - studio-unit
      - studio-ios
      - vrm-pages-build
      - platform-smoke
      - browser
      - agent-install-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every launch check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/launch-required.mjs
