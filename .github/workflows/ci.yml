name: ADV.JS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run tests/unit --reporter=default

  # Legacy main has the web Editor and no native desktop target.
  # Verify its real authoring build; require native CI if a desktop app is added.
  desktop-required:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Require the appropriate authoring pipeline
        run: |
          if [ -f apps/desktop/package.json ]; then
            echo 'Native desktop sources require the full Desktop CI pipeline'
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm editor:build
      - run: test -f editor/core/.output/server/index.mjs

  test-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build ADV.JS Lib
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  launch-required:
    if: always()
    needs: [build, lint, typecheck, unit, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every main runtime check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const failed = Object.entries(JSON.parse(process.env.NEEDS_JSON))
              .filter(([, job]) => job.result !== "success");
            if (failed.length) {
              console.error("Required main checks failed:", failed.map(([name, job]) => `${name}=${job.result}`).join(", "));
              process.exit(1);
            }
            console.log("All required main runtime checks passed");
          '
