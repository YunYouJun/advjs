name: Desktop CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: desktop build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package: ${{ steps.changes.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect desktop packaging changes
        id: changes
        env:
          DESKTOP_EVENT: ${{ github.event_name }}
          DESKTOP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DESKTOP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/desktop-changes.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop build scripts
        run: pnpm -C apps/desktop test:scripts
      - name: Build desktop host dependencies
        run: pnpm build:advjs
      - name: Typecheck and build desktop host
        run: node apps/desktop/scripts/build.mjs

  linux-package:
    needs: build
    if: github.event_name != 'workflow_dispatch' && needs.build.outputs.package == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      targets: '[{"os":"ubuntu-22.04","platform":"linux","arch":"x64"}]'

  full-matrix:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/desktop-build.yml

  desktop-required:
    name: desktop-required
    if: always()
    needs: [build, linux-package, full-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Require every applicable desktop check
        env:
          DESKTOP_EVENT: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/desktop-required.mjs
