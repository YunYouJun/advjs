# Compatibility filename for manual backfill; shared inputs live in ai.
name: AI Release Notes
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: {type: string, required: true}
      options:
        description: 可选 JSON，例如 {"language":"en","dry_run":true}
        type: string
permissions: {}

jobs:
  release-notes:
    uses: YunYouJun/ai/.github/workflows/release-notes.yml@d62e0cf890a0999c027c8e2589808b0f314d2de9
    permissions:
      actions: read
      contents: write
      pull-requests: read
      copilot-requests: write
