name: Release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact dev commit SHA to package
        required: true
        type: string
      version:
        description: Immutable candidate version
        required: true
        type: string
      state_json:
        description: Read-only Git/npm/Pages state snapshot JSON
        required: true
        type: string
      registry_url:
        description: npm-compatible registry (use a local registry for rehearsal)
        default: https://registry.npmjs.org
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing
        default: true
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: advjs-release
  cancel-in-progress: false

jobs:
  desktop:
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
      retention_days: 90

  candidate:
    needs: desktop
    runs-on: ubuntu-latest
    environment: ${{ inputs.dry_run && 'release-dry-run' || 'release-candidate' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          registry-url: ${{ inputs.registry_url }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified native desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-package-*
          path: desktop-candidate-assets
          merge-multiple: true
      - name: Materialize read-only release state
        env:
          RELEASE_STATE_JSON: ${{ inputs.state_json }}
        run: node -e "require('node:fs').writeFileSync('.release-state.json', process.env.RELEASE_STATE_JSON)"
      - name: Build immutable package set and manifest
        run: >-
          node scripts/release/create-manifest.mjs
          --source-sha ${{ inputs.source_sha }}
          --version ${{ inputs.version }}
          --state .release-state.json
          --desktop-artifacts desktop-candidate-assets
          --output release/${{ inputs.version }}/manifest.json
      - name: Verify local manifest and package integrity
        run: node scripts/release/verify-manifest.mjs release/${{ inputs.version }}/manifest.json
      - name: Rehearse idempotent candidate publication
        if: inputs.dry_run
        run: >-
          node scripts/release/publish-candidate.mjs
          release/${{ inputs.version }}/manifest.json
          --registry ${{ inputs.registry_url }}
          --dry-run
      - name: Publish candidate once
        if: ${{ !inputs.dry_run }}
        run: >-
          node scripts/release/publish-candidate.mjs
          release/${{ inputs.version }}/manifest.json
          --registry ${{ inputs.registry_url }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ inputs.version }}
          path: release/${{ inputs.version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
