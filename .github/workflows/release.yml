name: Release promotion transaction

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      artifact_name:
        description: Immutable candidate artifact name
        required: true
        type: string
      manifest:
        description: Manifest path inside the candidate artifact
        default: manifest.json
        required: true
        type: string
      evidence_json:
        description: Signed L6-07 browser evidence JSON (required for promotion)
        required: false
        type: string
      operation:
        description: Resume promotion or abort before the irreversible point
        default: promote
        required: true
        type: choice
        options:
          - promote
          - abort
      dry_run:
        description: Validate and print the transaction plan without mutations
        default: true
        required: true
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: advjs-release
  cancel-in-progress: false

jobs:
  transaction:
    runs-on: ubuntu-latest
    environment: release-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download immutable candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download ${{ inputs.candidate_run_id }}
          --name "${{ inputs.artifact_name }}"
          --dir release-transaction
      - name: Verify immutable release manifest
        run: node scripts/release/verify-manifest.mjs "release-transaction/${{ inputs.manifest }}"
      - name: Materialize signed approval evidence
        if: inputs.operation == 'promote' && !inputs.dry_run
        env:
          RELEASE_EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: node -e "require('node:fs').writeFileSync('release-evidence.json', process.env.RELEASE_EVIDENCE_JSON)"
      - name: Dry-run promotion
        if: inputs.operation == 'promote' && inputs.dry_run
        run: node scripts/release/promote.mjs "release-transaction/${{ inputs.manifest }}" --dry-run
      - name: Promote or resume the exact candidate
        if: inputs.operation == 'promote' && !inputs.dry_run
        run: >-
          node scripts/release/promote.mjs
          "release-transaction/${{ inputs.manifest }}"
          --evidence release-evidence.json
      - name: Dry-run abort
        if: inputs.operation == 'abort' && inputs.dry_run
        run: node scripts/release/abort.mjs "release-transaction/${{ inputs.manifest }}" --dry-run
      - name: Abort before the irreversible point
        if: inputs.operation == 'abort' && !inputs.dry_run
        run: node scripts/release/abort.mjs "release-transaction/${{ inputs.manifest }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-transaction-${{ inputs.candidate_run_id }}
          path: release-transaction/
          if-no-files-found: error
          retention-days: 90
    env:
      ADV_RELEASE_BOT_ACTOR: ${{ vars.ADV_RELEASE_BOT_ACTOR }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
