name: ADV.JS Docs

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify CSS production build compatibility
        run: pnpm exec vitest run tests/unit/build/css-vars.test.ts --reporter=default

      - name: Build
        run: pnpm docs:build
