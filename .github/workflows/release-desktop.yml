name: Release desktop applications

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (v1.2.3 or desktop-v1.2.3)
        required: true
        type: string
      candidate_run_id:
        description: Successful release-candidate workflow run containing the verified desktop packages
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Published release tag from the promotion transaction
        required: true
        type: string
      source_sha:
        description: Expected source commit from the verified release manifest
        required: true
        type: string
      candidate_run_id:
        description: Successful release-candidate workflow run to reuse
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Require a successful candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: node scripts/release/desktop-artifacts.mjs verify-run
      - name: Resolve and validate the exact release commit
        id: release
        env:
          DESKTOP_RELEASE_TAG: ${{ inputs.tag }}
          DESKTOP_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/release/desktop-artifacts.mjs resolve

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DESKTOP_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      DESKTOP_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      DESKTOP_CANDIDATE_DIRECTORY: release/${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: release-candidate-${{ needs.prepare.outputs.version }}
          path: ${{ env.DESKTOP_CANDIDATE_DIRECTORY }}
      - name: Verify candidate source, version and desktop ZIP integrity
        run: node scripts/release/desktop-artifacts.mjs verify-candidate "$DESKTOP_CANDIDATE_DIRECTORY/manifest.json"
      - name: Verify all platform assets and upload to the existing release
        run: node scripts/release/desktop-artifacts.mjs publish "$DESKTOP_CANDIDATE_DIRECTORY/desktop"
