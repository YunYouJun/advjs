# SPIKE (P0 feasibility). Generate with `xcodegen generate` in this directory;
# the generated StudioSpike.xcodeproj is not committed. Resources come from
# apps/studio-ios/spike/out, produced by the engine and player build scripts.
name: StudioSpike
options:
  bundleIdPrefix: org.advjs.studio
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  StudioSpike:
    type: application
    platform: iOS
    sources:
      - path: StudioSpike
      - path: ../out
        type: folder
        buildPhase: resources
      - path: ../fixtures
        type: folder
        buildPhase: resources
    info:
      path: StudioSpike/Info.plist
      properties:
        CFBundleDisplayName: ADV Spike
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.advjs.studio.spike
        GENERATE_INFOPLIST_FILE: NO
  StudioSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudioSpikeTests
    dependencies:
      - target: StudioSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.advjs.studio.spike.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StudioSpike.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StudioSpike
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  StudioSpike:
    build:
      targets:
        StudioSpike: all
        StudioSpikeTests: [test]
    test:
      targets:
        - StudioSpikeTests
